      Declared explicitly. Without it the browser requests /favicon.ico on every
      load and logs a 404 in the console, which is noise that hides real errors
      during development.

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    
    <!-- Google Fonts: Source Serif 4, Atkinson Hyperlegible, Lexend -->
