<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="SETU">
  <!--
    Setu means "bridge". Two banks, and a span across them: the mark is the
    product's one idea, drawn at 32px in the Broadsheet palette (paper white,
    near-black ink, cyan as the single spot colour).
  -->
  <rect width="32" height="32" rx="4" fill="#f3f2f2" />
  <path
    d="M5 21c0-6.1 4.9-11 11-11s11 4.9 11 11"
    fill="none"
    stroke="#0088b0"
    stroke-width="2.75"
    stroke-linecap="round"
  />
  <path d="M5 21v4M27 21v4" fill="none" stroke="#201e1d" stroke-width="2.75" stroke-linecap="round" />
  <path d="M3 25h26" fill="none" stroke="#201e1d" stroke-width="2.75" stroke-linecap="round" />
</svg>
